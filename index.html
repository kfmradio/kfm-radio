<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KFM Radio — K-Pop Your Life!</title>

<style>
  :root {
    --color-primary: #cf2f3b;     
    --color-bg-dark: #244776;     
    --color-bg-light: #4f81c2;    
    --color-orange: #e58143;      
    --color-orange-dark: #d17041; 
    --color-skin: #f7b8a4;        
    --color-text-dark: #1e1f1e;   
    --glass-bg: rgba(255, 255, 255, 0.18);
    --glass-border: rgba(255, 255, 255, 0.25);
    --glass-blur: blur(16px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Baloo 2', system-ui, -apple-system, sans-serif;
    background: var(--color-bg-dark);
    color: #ffffff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    user-select: none;
  }

  .app-window {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    background: var(--color-bg-light);
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  @media (min-width: 480px) {
    body { align-items: center; }
    .app-window { height: 85vh; max-height: 932px; border-radius: 32px; border: 2px solid var(--glass-border); }
  }

  .top-header { height: 65px; background: var(--color-bg-dark); border-bottom: 2px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; width: 100%; flex-shrink: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo-img { width: 38px; height: 38px; object-fit: contain; border-radius: 8px; background: var(--color-bg-light); }
  .brand-text h1 { font-size: 1.1rem; font-weight: 700; line-height: 1.1; color: #ffffff; }
  .brand-text p { font-size: 0.72rem; color: var(--color-orange); font-weight: 600; letter-spacing: 0.5px; }

  .live-badge { background: rgba(207, 47, 59, 0.25); border: 1px solid var(--color-primary); padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .live-dot { width: 6px; height: 6px; background: var(--color-primary); border-radius: 50%; animation: pulse 1.5s infinite; }

  .main-container { flex: 1; overflow-y: auto; padding: 10px 20px 85px 20px; width: 100%; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; }
  .main-container::-webkit-scrollbar { width: 0px; }

  .screen { display: none; opacity: 0; transform: translateY(10px); transition: opacity 200ms ease, transform 200ms ease; flex-direction: column; width: 100%; }
  .screen.active { display: flex; opacity: 1; transform: translateY(0); }

  #s-player { align-items: center; justify-content: space-between; height: 100%; flex: 1; gap: 16px; padding: 10px 0; }
  .cover-wrapper { position: relative; width: 185px; height: 185px; margin: 10px auto; flex-shrink: 0; }
  .cover-ring { position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; border: 2px dashed var(--color-orange-dark); border-radius: 24px; animation: rotateRing 25s linear infinite; transition: box-shadow 0.3s ease; }
  .cover-ring.playing { animation: rotateRing 25s linear infinite, glowPulse 2s ease-in-out infinite; }
  .main-cover { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,0.25); background: var(--color-bg-dark); }

  .track-meta { text-align: center; width: 100%; margin-bottom: 5px; }
  .track-title { font-size: 1.35rem; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 1.05rem; color: var(--color-text-dark); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .controls-card { width: 100%; background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: var(--glass-blur); border-radius: 24px; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
  .player-row { display: flex; align-items: center; justify-content: center; gap: 28px; }
  .btn-play { background: #ffffff; border: none; color: var(--color-bg-dark); width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; transition: all 0.2s ease; }
  .btn-play:active { transform: scale(0.92); }

  .volume-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 0 4px; }
  .volume-slider { flex: 1; -webkit-appearance: none; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.3); outline: none; }
  
  .action-buttons-vertical { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .btn-linktree, .btn-share { width: 100%; border: none; padding: 11px; border-radius: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: all 0.2s ease; }
  .btn-linktree { background: rgba(229, 129, 67, 0.85); color: #ffffff; }
  .btn-share { background: rgba(207, 47, 59, 0.85); color: #ffffff; }

  .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; background: var(--color-bg-dark); border-top: 2px solid var(--glass-border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; color: rgba(255, 255, 255, 0.6); cursor: pointer; }
  .nav-item.active { color: var(--color-orange); }

  @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes glowPulse { 0% { box-shadow: 0 0 12px rgba(229, 129, 67, 0.4); } 50% { box-shadow: 0 0 28px rgba(229, 129, 67, 0.85); } 100% { box-shadow: 0 0 12px rgba(229, 129, 67, 0.4); } }
</style>
</head>
<body>
  <div class="app-window">
    <header class="top-header">
      <div class="brand">
        <img class="logo-img" src="icon_fond_fonce.png" alt="KFM">
        <div class="brand-text"><h1>KFM Radio</h1><p>K-POP YOUR LIFE!</p></div>
      </div>
      <div class="live-badge"><div class="live-dot"></div><span>LIVE</span></div>
    </header>

    <main class="main-container">
      <section class="screen active" id="s-player">
        <div class="cover-wrapper"><div class="cover-ring" id="ring-element"></div><img class="main-cover" id="ctrl-cover" src="icon_fond_fonce.png"></div>
        <div class="track-meta"><div class="track-title" id="ctrl-title">KFM Radio</div><div class="track-artist" id="ctrl-artist">K-POP YOUR LIFE!</div></div>
        <div class="controls-card">
          <div class="player-row">
            <button class="btn-play" onclick="togglePlay()"><i class="fa-solid fa-play" id="play-icon"></i></button>
          </div>
          <div class="volume-row">
            <input type="range" class="volume-slider" id="volume-ctrl" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)">
          </div>
          <div class="action-buttons-vertical">
            <a class="btn-linktree" href="https://linktr.ee/kfmkpopyourlife" target="_blank">Join Community</a>
            <button class="btn-share" onclick="triggerNativeShare()">Share</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('player', this)"><i class="fa-solid fa-compact-disc"></i><span>Player</span></div>
      <div class="nav-item" onclick="switchTab('about', this)"><i class="fa-solid fa-circle-info"></i><span>About</span></div>
    </nav>
  </div>

  <script>
    let audioStream = null;
    let isPlaying = false;

    function togglePlay() {
      if (!audioStream) {
        audioStream = new Audio("https://play.radioking.io/kfmkpopyourlife");
        audioStream.volume = 0.8;
      }
      const icon = document.getElementById('play-icon');
      if (!isPlaying) {
        audioStream.play().then(() => { isPlaying = true; icon.className = "fa-solid fa-pause"; });
      } else {
        audioStream.pause(); isPlaying = false; icon.className = "fa-solid fa-play";
      }
    }

    function setVolume(val) { if (audioStream) audioStream.volume = val; }
    function triggerNativeShare() { if (navigator.share) navigator.share({title: 'KFM Radio', url: 'https://kfm-radio.com'}); }
    function switchTab(screenId, btn) { /* Logique simple de navigation */ }
  </script>
</body>
</html>
