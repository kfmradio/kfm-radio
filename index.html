<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KFM Radio — K-Pop Your Life!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --color-primary: #cf2f3b;     
    --color-bg-dark: #244776;     
    --color-orange: #e58143;      
    --glass-bg: rgba(255, 255, 255, 0.18);
    --glass-border: rgba(255, 255, 255, 0.25);
  }

  body { font-family: 'Baloo 2', sans-serif; background: var(--color-bg-dark); color: #ffffff; min-height: 100dvh; display: flex; justify-content: center; }
  .app-window { width: 100%; max-width: 430px; height: 100dvh; background: var(--color-bg-light); position: relative; display: flex; flex-direction: column; overflow: hidden; }

  /* Le cercle tournant (stable, sans vibration) */
  .cover-wrapper { position: relative; width: 185px; height: 185px; margin: 30px auto; }
  .cover-ring { 
    position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; 
    border: 2px dashed var(--color-orange); border-radius: 24px;
    animation: rotateRing 25s linear infinite;
    display: none; /* Caché par défaut */
  }
  .cover-ring.playing { display: block; }

  .main-cover { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; }

  /* Notifications (Toasts) */
  .toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--color-primary); color: white; padding: 10px 20px; border-radius: 20px;
    z-index: 1000; opacity: 0; pointer-events: none; transition: all 0.3s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes rotateRing { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app-window">
    <div class="toast" id="app-toast">Message</div>
    
    <main class="main-container">
      <section class="screen active" id="s-player">
        <div class="cover-wrapper">
          <div class="cover-ring" id="ring-element"></div>
          <img class="main-cover" id="ctrl-cover" src="icon_fond_fonce.png" alt="Album Art">
        </div>
        
        <div class="track-meta">
          <div class="track-title" id="ctrl-title">KFM Radio</div>
          <div class="track-artist" id="ctrl-artist">K-POP YOUR LIFE!</div>
        </div>

        <button class="btn-play" onclick="togglePlay()">
            <i class="fa-solid fa-play" id="play-icon"></i>
        </button>
      </section>
    </main>
</div>

<script>
    let audioStream = new Audio("https://play.radioking.io/kfmkpopyourlife");
    let isPlaying = false;

    function togglePlay() {
        const icon = document.getElementById('play-icon');
        const ring = document.getElementById('ring-element');
        
        if (!isPlaying) {
            audioStream.play();
            isPlaying = true;
            icon.className = "fa-solid fa-pause";
            ring.classList.add('playing');
            showToast("Playing live! 🎶");
        } else {
            audioStream.pause();
            isPlaying = false;
            icon.className = "fa-solid fa-play";
            ring.classList.remove('playing');
            showToast("Stream paused.");
        }
    }

    function showToast(msg) {
        const t = document.getElementById('app-toast');
        t.innerText = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }
</script>
</body>
</html>
