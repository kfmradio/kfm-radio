<div id="s-Player" class="screen active">...</div>
<div id="s-History" class="screen">
    <div class="content-header"><h2>Recently Played</h2></div>
    <div id="history-list" class="data-container">Chargement...</div>
</div>
<div id="s-Top" class="screen">
    <div class="content-header"><h2>Top Tracks</h2></div>
    <div id="top-list" class="data-container">Chargement...</div>
</div>

<script>
    let audioStream = new Audio("https://play.radioking.io/kfmkpopyourlife");
    let isPlaying = false;

    // 1. Gestion du Player
    function togglePlay() {
        const ring = document.getElementById('ring-element');
        const icon = document.getElementById('play-icon');
        
        if (!isPlaying) {
            audioStream.play();
            isPlaying = true;
            icon.className = "fa-solid fa-pause";
            ring.classList.add('playing');
        } else {
            audioStream.pause();
            isPlaying = false;
            icon.className = "fa-solid fa-play";
            ring.classList.remove('playing');
        }
    }

    // 2. Mise à jour automatique des données
    async function fetchData(url, containerId) {
        try {
            const response = await fetch(url);
            const data = await response.json();
            const container = document.getElementById(containerId);
            
            // Génère la liste proprement
            container.innerHTML = data.map(track => `
                <div class="track-item">
                    <img src="${track.cover}" alt="cover">
                    <div class="track-info">
                        <strong>${track.title}</strong><br>
                        <span>${track.artist}</span>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            document.getElementById(containerId).innerHTML = "Impossible de charger les données.";
        }
    }

    // Initialisation
    window.onload = () => {
        fetchData("https://api.radioking.io/widget/radio/kfmkpopyourlife/track/current", "ctrl-title"); // Adapter selon ton besoin
        fetchData("https://api.radioking.io/widget/radio/kfmkpopyourlife/track/historic/recent", "history-list");
        fetchData("https://api.radioking.io/widget/radio/kfmkpopyourlife/track/top/week", "top-list");
    };

    // Navigation onglets
    function switchTab(screenId, navBtn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('s-' + screenId).classList.add('active');
        navBtn.classList.add('active');
    }
</script>
