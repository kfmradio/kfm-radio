<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KFM Radio - K-Pop Your Life!</title>
    <!-- Font Awesome pour les icônes et Baloo 2 pour le style rounded -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Baloo 2', sans-serif;
            background-color: #010101;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Conteneur type Smartphone App */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: linear-gradient(135deg, #1e1f1e 0%, #010101 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* Header */
        .header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(30, 31, 30, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 10;
        }

        .logo-placeholder {
            height: 40px;
            display: flex;
            align-items: center;
        }

        .logo-placeholder img {
            height: 100%;
            object-fit: contain;
        }

        /* Contenu Principal */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 90px;
        }

        .tab-content {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* Badge LIVE */
        .live-badge {
            background-color: #cf2f3b;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 25px;
            animation: pulse 1.5s infinite;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
        }

        /* Vinyle & Pochette */
        .art-container {
            position: relative;
            width: 240px;
            height: 240px;
            margin-bottom: 25px;
        }

        .art-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #2d2d2d 30%, #151515 70%, #050505 100%);
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 20s linear infinite;
            animation-play-state: paused;
        }

        .playing .art-ring {
            animation-play-state: running;
        }

        .track-art {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }

        /* Métadonnées */
        .track-info {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            padding: 0 10px;
        }

        .track-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .track-artist {
            font-size: 1rem;
            color: #e58143;
            font-weight: 500;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Égaliseur visuel */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 25px;
            margin-bottom: 25px;
        }

        .bar {
            width: 3px;
            height: 3px;
            background-color: #cf2f3b;
            border-radius: 3px;
            transition: height 0.2s ease;
        }

        /* Zone de contrôle unique et recentrée */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .play-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #cf2f3b;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(207, 47, 59, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        /* Volume */
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 80%;
            max-width: 280px;
            background-color: rgba(255,255,255,0.03);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .volume-icon {
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            width: 15px;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e58143;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Phrase d'accroche Communauté */
        .social-callout {
            text-align: center;
            font-size: 0.85rem;
            color: #e58143;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* Boutons Réseaux Sociaux */
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.1rem;
            transition: background-color 0.2s, color 0.2s;
        }

        .social-btn:hover {
            background-color: rgba(255,255,255,0.1);
            color: #ffffff;
        }

        /* Navigation Onglets (Bas de l'écran) */
        .nav-tabs {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background-color: #1e1f1e;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            z-index: 10;
        }

        .nav-tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            gap: 4px;
            font-family: 'Baloo 2', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-tab i {
            font-size: 1.2rem;
        }

        .nav-tab.active {
            color: #e58143;
        }

        /* Styles Onglets Secondaires (Historique & À propos) */
        .history-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: rgba(255,255,255,0.02);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .history-art {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
        }

        .history-details {
            flex: 1;
            min-width: 0;
        }

        .history-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-artist {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-time {
            font-size: 0.75rem;
            color: #e58143;
            font-weight: 500;
        }

        .about-box {
            background-color: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            text-align: center;
        }

        .about-title {
            color: #e58143;
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .about-text {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.6;
        }

        /* Animations */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="app-container" id="playerContainer">
        
        <!-- En-tête avec logo -->
        <header class="header">
            <div class="logo-placeholder">
                <!-- Votre logo actuel est intégré ici en tâche d'arrière-plan ou via script -->
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="KFM Radio" id="headerLogo">
            </div>
        </header>

        <!-- Zone Centrale de l'App -->
        <main class="main-content">
            
            <!-- ONGLET 1 : LECTEUR PRINCIPAL -->
            <section class="tab-content active" id="playerTab">
                <div class="live-badge">
                    <span class="live-dot"></span>LIVE
                </div>

                <div class="art-container">
                    <div class="art-ring">
                        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=300&auto=format&fit=crop" alt="Pochette" class="track-art" id="trackArt">
                    </div>
                </div>

                <div class="track-info">
                    <h1 class="track-title" id="trackTitle">Chargement...</h1>
                    <p class="track-artist" id="trackArtist">KFM Radio</p>
                </div>

                <div class="equalizer" id="equalizer">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>

                <!-- Section Bouton Play Unique et Centré -->
                <div class="controls">
                    <button class="play-btn" id="playBtn" aria-label="Play">
                        <i class="fas fa-play" id="playIcon"></i>
                    </button>
                </div>

                <!-- Contrôle du Volume -->
                <div class="volume-container">
                    <i class="fas fa-volume-down volume-icon"></i>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" aria-label="Volume">
                    <i class="fas fa-volume-up volume-icon"></i>
                </div>

                <!-- Phrase d'Accroche pour la Communauté -->
                <div class="social-callout">
                    Join the community & follow us!
                </div>

                <!-- Boutons Réseaux Sociaux -->
                <div class="social-buttons">
                    <!-- Nouveau Bouton Threads avec logo officiel SVG -->
                    <a href="https://www.threads.net" target="_blank" aria-label="Threads" class="social-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 448 512" style="vertical-align: middle;">
                            <path d="M432 256c0 101.6-82.4 184-184 184-33.1 0-64.2-8.8-91.2-24.1l-24.3 24.3c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6l23.4-23.4C111.4 362.4 96 311 96 256c0-101.6 82.4-184 184-184 101.6 0 184 82.4 184 184zm-184-96c-53 0-96 43-96 96s43 96 96 96 96-43 96-96-43-96-96-96zm0 144c-26.5 0-48-21.5-48-48s21.5-48 48-48 48 21.5 48 48-21.5 48-48 48z"/>
                        </svg>
                    </a>
                    <a href="#" target="_blank" aria-label="Instagram" class="social-btn"><i class="fab fa-instagram"></i></a>
                    <a href="#" target="_blank" aria-label="TikTok" class="social-btn"><i class="fab fa-tiktok"></i></a>
                </div>
            </section>

            <!-- ONGLET 2 : TITRES RÉCENTS -->
            <section class="tab-content" id="historyTab">
                <div class="history-list" id="historyList">
                    <!-- Les titres récents injectés par votre script iront ici -->
                    <div class="history-item">
                        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=100&auto=format&fit=crop" class="history-art" alt="album">
                        <div class="history-details">
                            <div class="history-title">Exemple Titre K-Pop</div>
                            <div class="history-artist">Artiste K-Pop</div>
                        </div>
                        <div class="history-time">16:34</div>
                    </div>
                </div>
            </section>

            <!-- ONGLET 3 : À PROPOS -->
            <section class="tab-content" id="aboutTab">
                <div class="about-box">
                    <h2 class="about-title">KFM Radio</h2>
                    <p class="about-text">
                        Votre webradio suisse 100% K-Pop. Diffusée en direct 24h/24 et 7j/7 pour vous apporter le meilleur de la musique coréenne.
                    </p>
                </div>
            </section>

        </main>

        <!-- Barre de Navigation en Bas -->
        <nav class="nav-tabs">
            <button class="nav-tab active" data-tab="playerTab">
                <i class="fas fa-radio"></i>
                <span>Player</span>
            </button>
            <button class="nav-tab" data-tab="historyTab">
                <i class="fas fa-history"></i>
                <span>Récents</span>
            </button>
            <button class="nav-tab" data-tab="aboutTab">
                <i class="fas fa-info-circle"></i>
                <span>À propos</span>
            </button>
        </nav>

    </div>

    <!-- Le script de votre player externe ou en fin de page se chargera d'animer le tout -->
</body>
</html>
