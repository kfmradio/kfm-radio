<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1528">

<title>KFM Radio — K-Pop Your Life!</title>

<style>
  :root {
    --color-primary: #cf2f3b;
    --color-bg-start: #0b1528;
    --color-bg-end: #050914;
    --color-orange: #e58143;
    --color-muted: #a8bcd8;
    --glass-bg: rgba(255, 255, 255, 0.04);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-blur: blur(16px);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Baloo 2', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, var(--color-bg-start) 0%, var(--color-bg-end) 100%);
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
    user-select: none;
  }

  /* Header en miroir - Glassmorphism */
  .top-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 100;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-img {
    width: 40px;
    height: 40px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }

  .brand-text h1 {
    font-size: 1.2rem;
    font-weight: 700;
    line-height: 1.1;
  }

  .brand-text p {
    font-size: 0.75rem;
    color: var(--color-orange);
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .live-badge {
    background: rgba(207, 47, 59, 0.2);
    border: 1px solid var(--color-primary);
    color: #ffffff;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 12px rgba(207, 47, 59, 0.4);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    background: var(--color-primary);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  /* Main Container & Screens */
  .main-container {
    flex: 1;
    margin-top: 70px;
    margin-bottom: 80px;
    position: relative;
    width: 100%;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    padding: 20px;
  }

  .screen {
    display: none;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 250ms ease, transform 250ms ease;
  }

  .screen.active {
    display: flex;
    flex-direction: column;
    opacity: 1;
    transform: translateY(0);
  }

  /* --- SCREEN: PLAYER --- */
  #s-player {
    align-items: center;
    gap: 20px;
  }

  .cover-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
    margin: 10px 0;
  }

  .cover-ring {
    position: absolute;
    top: -8px;
    left: -8px;
    right: -8px;
    bottom: -8px;
    border: 2px dashed rgba(207, 47, 59, 0.4);
    border-radius: 24px;
    animation: rotateRing 20s linear infinite;
  }

  .cover-ring.playing {
    border-color: var(--color-primary);
    box-shadow: 0 0 15px rgba(207, 47, 59, 0.2);
  }

  .main-cover {
    width: 100%;
    height: 100%;
    border-radius: 18px;
    object-fit: cover;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    background: #14223a;
  }

  .track-meta {
    text-align: center;
    width: 100%;
    padding: 0 10px;
  }

  .track-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-artist {
    font-size: 1.1rem;
    color: var(--color-muted);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Égaliseur Web Audio */
  .eq-container {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    height: 32px;
    margin: 5px 0;
  }

  .eq-bar {
    width: 4px;
    height: 3px;
    background: var(--color-primary);
    border-radius: 2px;
    transition: height 0.1s ease;
  }

  .live-status-text {
    font-size: 0.8rem;
    color: var(--color-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Bloc Contrôles Glassmorphism */
  .controls-card {
    width: 100%;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-radius: 24px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .player-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    width: 100%;
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    color: #ffffff;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-secondary:active {
    transform: scale(0.92);
    background: rgba(255, 255, 255, 0.1);
  }

  .btn-secondary.active {
    color: var(--color-primary);
    border-color: rgba(207, 47, 59, 0.4);
    background: rgba(207, 47, 59, 0.1);
  }

  .btn-play {
    background: #14223a;
    border: 3px solid var(--color-primary);
    color: #ffffff;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(207, 47, 59, 0.5);
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .btn-play:active {
    transform: scale(0.92);
    box-shadow: 0 0 10px rgba(207, 47, 59, 0.3);
  }

  /* Slider Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 0 10px;
  }

  .volume-row i {
    color: var(--color-muted);
    font-size: 0.9rem;
    width: 16px;
  }

  .volume-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.1);
    outline: none;
  }

  .volume-slider::-webkit-slider-runnable-track {
    width: 100%;
    height: 6px;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--color-primary);
    cursor: pointer;
    margin-top: -5px;
    box-shadow: 0 0 8px rgba(207, 47, 59, 0.5);
  }

  /* Réseaux Sociaux en Cercles */
  .social-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: 100%;
    margin-top: 5px;
  }

  .social-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    text-decoration: none;
    font-size: 1.1rem;
    transition: all 0.2s ease;
  }

  .social-circle:active {
    transform: scale(0.9);
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
  }

  /* Bouton d'interaction / Toast Action */
  .btn-toast-trigger {
    width: 100%;
    background: var(--color-primary);
    color: #ffffff;
    border: none;
    padding: 12px;
    border-radius: 30px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(207, 47, 59, 0.3);
    transition: all 0.2s ease;
  }

  .btn-toast-trigger:active {
    transform: scale(0.97);
    background: #b52430;
  }

  /* Toast Notifications */
  .toast {
    position: fixed;
    bottom: 95px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: rgba(11, 21, 40, 0.9);
    border: 1px solid var(--color-primary);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: white;
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 0.9rem;
    font-weight: 500;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: all 300ms cubic-bezier(0.175, 0.885, 0.32, 1.175);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* --- SCREENS SECONDAIRES (Recently, Top, About) --- */
  .screen-title {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 15px;
    border-bottom: 2px solid var(--glass-border);
    padding-bottom: 6px;
  }

  .recent-list, .top-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }

  .recent-item, .top-item {
    display: flex;
    align-items: center;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 10px 14px;
    border-radius: 16px;
    gap: 14px;
  }

  .recent-cover {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
  }

  .recent-cover-placeholder {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: #14223a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .recent-info {
    flex: 1;
    min-width: 0;
  }

  .recent-title {
    font-size: 1rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .recent-artist {
    font-size: 0.85rem;
    color: var(--color-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .recent-time {
    font-size: 0.75rem;
    color: var(--color-muted);
  }

  /* Top Tracks & Médailles */
  .top-rank {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
  }

  .top-rank.gold { background: #ffd700; color: #000; box-shadow: 0 0 8px rgba(255,215,0,0.4); }
  .top-rank.silver { background: #c0c0c0; color: #000; }
  .top-rank.bronze { background: #cd7f32; color: #000; }

  .top-votes {
    font-size: 0.85rem;
    color: var(--color-primary);
    font-weight: 600;
  }

  /* About Screen Elements */
  .about-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .about-card h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: var(--color-orange);
  }

  .about-card p {
    font-size: 0.95rem;
    color: #e2e8f0;
    line-height: 1.5;
  }

  .btn-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    margin-top: 8px;
    transition: background 0.2s;
  }

  .btn-link:active {
    background: rgba(255,255,255,0.12);
  }

  /* --- BOTTOM NAVIGATION BAR --- */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 75px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border-top: 1px solid var(--glass-border);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--color-muted);
    text-decoration: none;
    width: 20%;
    height: 100%;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .nav-item i {
    font-size: 1.3rem;
    margin-bottom: 2px;
    transition: transform 0.2s ease;
  }

  .nav-item span {
    font-size: 0.75rem;
    font-weight: 500;
  }

  .nav-item.active {
    color: var(--color-orange);
  }

  .nav-item.active i {
    transform: translateY(-2px);
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.5; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes rotateRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

  <header class="top-header">
    <div class="brand">
      <div class="logo" id="logo-container">
        <img class="logo-img" id="logo-img" alt="KFM">
      </div>
      <div class="brand-text">
        <h1>KFM Radio</h1>
        <p>K-POP YOUR LIFE!</p>
      </div>
    </div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span>LIVE</span>
    </div>
  </header>

  <div class="toast" id="app-toast">Thanks for the love! ♥</div>

  <main class="main-container">
    
    <section class="screen active" id="s-player">
      <div class="cover-wrapper">
        <div class="cover-ring" id="ring-element"></div>
        <img class="main-cover" id="ctrl-cover" src="" alt="Album Art">
      </div>
      
      <div class="track-meta">
        <div class="track-title" id="ctrl-title">Loading...</div>
        <div class="track-artist" id="ctrl-artist">KFM Radio</div>
      </div>
