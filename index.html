<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFM Radio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { margin: 0; background-color: #244776; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-window { width: 100%; max-width: 400px; text-align: center; }
        
        /* Cercle */
        .cover-wrapper { position: relative; width: 200px; height: 200px; margin: 0 auto; }
        .cover-ring { 
            position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
            border: 3px dashed #e58143; border-radius: 20px;
            display: none;
        }
        .cover-ring.playing { display: block; animation: rotate 20s linear infinite; }
        .main-cover { width: 100%; height: 100%; border-radius: 15px; }
        
        /* Toast */
        #toast { position: fixed; top: 20px; background: #cf2f3b; padding: 10px 20px; border-radius: 20px; opacity: 0; transition: 0.3s; }
        #toast.show { opacity: 1; }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="toast">Message</div>

<div class="app-window">
    <div class="cover-wrapper">
        <div id="ring" class="cover-ring"></div>
        <img id="cover" src="icon_fond_fonce.png" class="main-cover">
    </div>
    <h2 id="title">KFM Radio</h2>
    <p>K-POP YOUR LIFE!</p>
    <button id="btn" style="padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer;">
        <i id="icon" class="fa-solid fa-play"></i>
    </button>
</div>

<script>
    const audio = new Audio("https://play.radioking.io/kfmkpopyourlife");
    const ring = document.getElementById('ring');
    const icon = document.getElementById('icon');
    const toast = document.getElementById('toast');

    function showToast(msg) {
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('btn').onclick = () => {
        if (audio.paused) {
            audio.play();
            ring.classList.add('playing');
            icon.className = "fa-solid fa-pause";
            showToast("En direct ! 🎶");
        } else {
            audio.pause();
            ring.classList.remove('playing');
            icon.className = "fa-solid fa-play";
            showToast("Pause.");
        }
    };
</script>
</body>
</html>
